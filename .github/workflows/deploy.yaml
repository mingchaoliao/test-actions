name: Deploy Trigger

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'The environment to which a deployment should be done'
        required: true
      ref:
        description: 'The ref to deploy'
        required: false

jobs:
  trigger-deploy:
    runs-on: cad
    env:
#      GH_TOKEN: ${{ secrets.APPROVER_PAT }}
#      RUN_ID: ${{ github.event.inputs.run_id }}
    steps:
      - name: Approve Deployment via REST API
        run: |
          # 1. Fetch pending deployments to get environment IDs
          PENDING_DATA=$(gh api /repos/${{ github.repository }}/actions/runs/$RUN_ID/pending_deployments)

          # 2. Extract environment IDs using jq (pre-installed on runners)
          ENV_IDS=$(echo "$PENDING_DATA" | jq -r '.[].environment.id' | tr '\n' ',' | sed 's/,$//')

          if [ -z "$ENV_IDS" ]; then
            echo "No pending deployments found for Run ID $RUN_ID"
            exit 0
          fi

          # 3. Submit approval for all pending environments
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/runs/$RUN_ID/pending_deployments \
            -f "environment_ids[]=$ENV_IDS" \
            -f state='approved' \
            -f comment='Automatic approval via gh cli'
