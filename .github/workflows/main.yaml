name: 'Deploy'

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  deployments: write
  actions: read

jobs:
  plan-dev:
    name: 'Dev'
    uses: ./.github/workflows/shared-tofu-plan.yaml
    with:
      env: dev
      pr-number: ${{ github.event.pull_request.number }}

  preview-plan-test-qa-prod:
    name: 'Dev'
    needs: plan-dev
    concurrency:
      group: tofu-plan-${{ matrix.env }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        env: [ test, qa, prod ]
    uses: ./.github/workflows/shared-tofu-plan.yaml
    with:
      env: ${{ matrix.env }}
      pr-number: ${{ github.event.pull_request.number }}
      is-preview: true

  apply-dev:
    name: 'Dev'
    needs: plan-dev
    uses: ./.github/workflows/shared-tofu-apply.yaml
    with:
      env: dev

  plan-test:
    name: 'Test'
    needs: apply-dev
    concurrency:
      group: tofu-plan-test-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/shared-tofu-plan.yaml
    with:
      env: test
      pr-number: ${{ github.event.pull_request.number }}

  preview-plan-qa-prod:
    name: 'Test'
    needs: plan-test
    concurrency:
      group: tofu-plan-${{ matrix.env }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        env: [ qa, prod ]
    uses: ./.github/workflows/shared-tofu-plan.yaml
    with:
      env: ${{ matrix.env }}
      pr-number: ${{ github.event.pull_request.number }}
      is-preview: true

  apply-test:
    name: 'Test'
    needs: plan-test
    uses: ./.github/workflows/shared-tofu-apply.yaml
    with:
      env: test

  plan-qa:
    name: 'QA'
    needs: apply-test
    concurrency:
      group: tofu-plan-qa-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/shared-tofu-plan.yaml
    with:
      env: qa
      pr-number: ${{ github.event.pull_request.number }}

  preview-plan-prod:
    name: 'QA'
    needs: plan-qa
    concurrency:
      group: tofu-plan-${{ matrix.env }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        env: [ prod ]
    uses: ./.github/workflows/shared-tofu-plan.yaml
    with:
      env: ${{ matrix.env }}
      pr-number: ${{ github.event.pull_request.number }}
      is-preview: true

  apply-qa:
    name: 'QA'
    needs: plan-qa
    uses: ./.github/workflows/shared-tofu-apply.yaml
    with:
      env: qa

  plan-prod:
    name: 'Prod'
    needs: apply-qa
    concurrency:
      group: tofu-plan-prod-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/shared-tofu-plan.yaml
    with:
      env: prod
      pr-number: ${{ github.event.pull_request.number }}

  apply-prod:
    name: 'Prod'
    needs: plan-prod
    uses: ./.github/workflows/shared-tofu-apply.yaml
    with:
      env: prod
